<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Class-AI Live</title>
    <!-- سایر استایل‌های شما دقیقاً حفظ شده‌اند -->
    <style>
        /* [تمامی استایل‌های اصلی شما اینجا باقی می‌ماند] */
    </style>
</head>
<body>
    <!-- [تمامی بدنه HTML و المان‌های شما اینجا باقی می‌ماند] -->

    <script>
        // کانفیگ اختصاصی شما
        const apiConfig = {
            apiKey: 'sk-CkdV2JhHRMw7EE6PpvxBkmrKlVtGwlpjQzMM6nOAkpzPgHEs', // کلید خود را اینجا چک کنید
            endpoint: 'https://api.gapgpt.app/v1/chat/completions',
            model: 'gpt-4o-mini'
        };

        // تابع اتصال که خطاهای دقیق را گزارش می‌دهد
        async function sendToGapGPT(userMessage) {
            try {
                const response = await fetch(apiConfig.endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + apiConfig.apiKey.trim()
                    },
                    body: JSON.stringify({
                        model: apiConfig.model,
                        messages: [{ role: 'user', content: userMessage }],
                        stream: false
                    })
                });

                if (!response.ok) {
                    // اگر خطا داد، متن دقیق سرور را می‌گیریم
                    const errorDetails = await response.text();
                    throw new Error(`خطای ${response.status}: ${errorDetails}`);
                }

                const data = await response.json();
                return data.choices[0].message.content;

            } catch (err) {
                // نمایش دقیق خطا برای دیباگ
                console.error("خطای اتصال:", err);
                alert("خطای سیستم! جزئیات: " + err.message);
                return null;
            }
        }
    </script>
</body>
</html>
