<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دستیار هوشمند دانش‌آموز - Class AI</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Tahoma, sans-serif; }
    body { background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .chat-container { background: #fff; width: 100%; max-width: 650px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    h2 { margin: 0 0 8px 0; color: #1a73e8; text-align: center; }
    p.desc { margin: 0 0 16px 0; color: #5f6368; font-size: 0.9em; text-align: center; }
    textarea { width: 100%; height: 110px; padding: 12px; border: 1px solid #dadce0; border-radius: 10px; resize: vertical; font-size: 1rem; outline: none; }
    textarea:focus { border-color: #1a73e8; }
    .btn-send { background-color: #1a73e8; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .btn-send:hover { background-color: #1557b0; }
    .btn-send:disabled { background-color: #9aa0a6; cursor: not-allowed; }
    .response-box { background: #f8f9fa; border: 1px solid #e8eaed; border-radius: 10px; padding: 16px; min-height: 120px; white-space: pre-wrap; line-height: 1.6; color: #202124; font-size: 0.95rem; }
    .status { font-size: 0.85em; color: #70757a; text-align: center; min-height: 1.2em; }
    .error { color: #d93025; font-weight: bold; }
  </style>
</head>
<body>

<div class="chat-container">
  <h2>دستیار هوشمند دانش‌آموز</h2>
  <p class="desc">سوال، تمرین یا مبحث درسی خود را بنویسید تا پاسخ کامل دریافت کنید.</p>
  
  <textarea id="questionInput" placeholder="سوال خود را اینجا بنویسید..."></textarea>
  <button id="sendBtn" class="btn-send" onclick="askQuestion()">ارسال سوال و دریافت پاسخ</button>
  <div id="statusText" class="status"></div>
  <div id="responseArea" class="response-box">پاسخ پس از ارسال در اینجا نمایش داده می‌شود...</div>
</div>

<script>
  // ==========================================
  // فقط کلید اختصاصی خود را در خط زیر قرار دهید:
  const GAPGPT_API_KEY = "GAPGPTMASKTOKEN4l9afxm4b33X1X";
  // ==========================================

  async function askQuestion() {
    const input = document.getElementById("questionInput");
    const sendBtn = document.getElementById("sendBtn");
    const statusText = document.getElementById("statusText");
    const responseArea = document.getElementById("responseArea");

    const promptText = input.value.trim();
    if (!promptText) {
      alert("لطفاً ابتدا سوال خود را بنویسید.");
      return;
    }

    if (GAPGPT_API_KEY === "GAPGPTMASKTOKEN4l9afxm4b33X2X" || !GAPGPT_API_KEY) {
      alert("لطفاً کلید API خود را در خط مربوطه داخل فایل قرار دهید.");
      return;
    }

    // آماده‌سازی ظاهر برای ارسال
    sendBtn.disabled = true;
    statusText.innerText = "در حال ارتباط و دریافت پاسخ از هوش مصنوعی...";
    statusText.classList.remove("error");
    responseArea.innerText = "در حال پردازش و نگارش پاسخ...";

    try {
      const response = await fetch("https://api.gapgpt.app/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${GAPGPT_API_KEY}`
        },
        body: JSON.stringify({
          model: "gpt-4o-mini",
          messages: [
            {
              role: "system",
              content: "شما یک دستیار هوشمند درسی هستید. به سوالات دانش‌آموز با لحن محترمانه، گام‌به‌گام و دقیق به زبان فارسی پاسخ دهید."
            },
            {
              role: "user",
              content: promptText
            }
          ],
          temperature: 0.7
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error?.message || `خطای سرور با کد ${response.status}`);
      }

      const answer = data.choices?.[0]?.message?.content;
      if (answer) {
        responseArea.innerText = answer;
        statusText.innerText = "پاسخ با موفقیت دریافت شد.";
      } else {
        responseArea.innerText = "پاسخی از سمت سرور بازگردانده نشد.";
        statusText.innerText = "";
      }

    } catch (err) {
      statusText.innerText = "خطا در اتصال به سرویس";
      statusText.classList.add("error");
      responseArea.innerText = "متن خطا: " + err.message + "\n\n(در صورت بروز Failed to fetch، وضعیت اتصال اینترنت/فیلترشکن را بررسی کنید)";
    } finally {
      sendBtn.disabled = false;
    }
  }
</script>

</body>
</html>
